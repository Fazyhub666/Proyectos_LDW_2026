<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de alumnos</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      color: #17212b;
      background: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: #fff;
    }

    main {
      width: min(100% - 40px, 960px);
      margin: 0 auto;
      padding: 72px 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #4386bb;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 2.7rem);
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 12px 0 30px;
      color: #596773;
      line-height: 1.6;
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #dce8f1;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 600px;
      border-collapse: collapse;
      text-align: left;
    }

    thead {
      background: #eaf5fc;
    }

    th,
    td {
      padding: 15px 18px;
    }

    th {
      color: #20394c;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    td {
      border-top: 1px solid #e8eef3;
    }

    .empty-state {
      padding: 28px 18px;
      color: #596773;
      text-align: center;
    }

    @media (max-width: 600px) {
      main {
        width: min(100% - 28px, 960px);
        padding: 48px 0;
      }

      th,
      td {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Registro de los proyectos realizados por nuestros estudiantes.</p>
    <h1>PROYECTOS LABORATORIO DE DISEÑO WEB 5°3°</h1>
    <p class="intro">Consulta los datos de cada alumno, su tema y el enlace correspondiente.</p>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th scope="col">Alumno</th>
            <th scope="col">Proyecto</th>
            <th scope="col">Tema</th>
            <th scope="col">Link</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="empty-state" colspan="3">No hay datos cargados todavía.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
